<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hendon Classes</title>
    <!---->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <div id="Lesson">
        <h1 id = "title">Lesson</h1>

        <button v-on:click="toggleCart" :disabled="cart.length === 0">
            <i class = "fa-solid fa-cart-shopping"></i> Cart ({{ cart.length }})
        </button>

        <div v-if="!showCart">
            <label>Sort by:
                <select v-model="sortBy">
                    <option value = "topic">Subject</option>
                    <option value = "location">Location</option>
                    <option value = "price">Price</option>
                    <option value = "space">Spaces</option>
                    
                </select>
            </label>
            <label>Order:
                <select v-model="sortOrder">
                    <option value = "ascending">Ascending</option>
                    <option value = "descending">Descending</option>
                </select>
            </label>

            <div v-for="lesson in sortedLessons" :key="lesson._id">
                <i class="fa-solid fa-book-open fa-2x"></i>
                <h2>{{ lesson.topic }}</h2>
                <p>Location: {{lesson.location}}</p>
                <p>Price: {{lesson.price}}</p>
                <p>Spaces: {{lesson.space}}</p>
                <button v-on:click="addToCart(lesson)" :disabled="lesson.space === 0">Add to cart</button>
            </div>
        </div>
        <div v-else>
            <h2>Your cart</h2>
            <div v-for="(item,index) in cart" :key="index">
                <p> {{item.topic }} - {{item.location}} - £{{item.price}}</p>
                <button v-on:click="removeFromCart(index)">Remove</button>
            </div>
        </div>
    
        </div>

    <script type = "module">
        const {createApp} = Vue
        const myApp = createApp({
            data(){
                return{
                   lessons: [],
                   cart:[],
                   showCart: false,
                   sortBy: 'topic',
                   sortOrder: 'ascending'

                  
                     
                }
                
            },
            methods:{
                addToCart(lesson){
                    if (lesson.space > 0){
                        this.cart.push(lesson);
                        lesson.space--
                    }
                },
                toggleCart(){
                    this.showCart = !this.showCart;
                },
                removeFromCart(index){
                    const lesson = this.cart[index];
                    this.cart.splice(index,1);
                    lesson.space++;

                    if (this.cart.length === 0){
                        this.showCart = false;
                    }

                }

            },
            computed: {
                sortedLessons(){
                    return [... this.lessons].sort((a,b)=>{
                        let result = 0;
                        if (a[this.sortBy]> b[this.sortBy]) result = 1;
                        if (a[this.sortBy]< b[this.sortBy]) result = -1;
                        return this.sortOrder === 'ascending' ? result : -result;

                    });
                }

            },
            created(){
                fetch('https://m01005054-rafter-skl.onrender.com/lessons')
                .then(response=> response.json())
                .then(data=> {
                    this.lessons = data;
                });
            }

          
        })
        myApp.mount('#Lesson')
    </script>
<style>
    .title {color: aqua,;font-size: 200%;}
</style>
</body>
</html>
