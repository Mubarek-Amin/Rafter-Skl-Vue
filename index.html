<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafter Skl</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root { --main: #7b3fe4; --bg: #f5f3fa; }
        body { font-family: system-ui, sans-serif; background: var(--bg); margin: 0; padding: 24px; color: #222; }
        #title { color: var(--main); margin-top: 0; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 16px 0; }
        input, select { padding: 8px 10px; border: 1px solid #ccc; border-radius: 8px; font: inherit; }
        button { background: var(--main); color: white; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font: inherit; }
        button:disabled { background: #bbb; cursor: not-allowed; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        .card { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.08); text-align: center; }
        .card img { width: 80px; height: 80px; }
        .card p { margin: 4px 0; }
        span { color: #c62828; font-size: 0.9em; }
</style>
</head>
<body>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <div id="Lesson">
        <h1 id = "title">Rafter skl lessons</h1>

        <button v-on:click="toggleCart" :disabled="cart.length === 0">
            <i class = "fa-solid fa-cart-shopping"></i> Cart ({{ cart.length }})
        </button>
        <p v-if ="orderMessage">{{ orderMessage }}</p>

        <div v-if="!showCart">
          <div class="toolbar">
            <label>Sort by:
                <select v-model="sortBy">
                    <option value = "topic">Subject</option>
                    <option value = "location">Location</option>
                    <option value = "price">Price</option>
                    <option value = "space">Spaces</option>
                    
                </select>
            </label>
            <input v-model="searchQuery" placeholder="Search lessons...">
            <label>Teacher:
                <select v-model="selectedTeacher">
                    <option value="">All Teachers</option>
                    <option v-for="teacher in teachers" :key="teacher._id" :value="teacher._id">
                        {{teacher.firstName}} {{teacher.lastName}}
                    </option>
                </select>
            </label>
            <label>Order:
                <select v-model="sortOrder">
                    <option value = "ascending">Ascending</option>
                    <option value = "descending">Descending</option>
                </select>
            </label>
            </div>

            <div class="grid">
            <div class ="card" v-for="lesson in displayedLessons" :key="lesson._id">
                <img :src="api + '/images/' + lesson.image" :alt="lesson.topic">
                <h2>{{ lesson.topic }}</h2>
                <p>Location: {{lesson.location}}</p>
                <p>Price: £{{lesson.price}}</p>
                <p>Spaces: {{lesson.space}}</p>
                <button v-on:click="addToCart(lesson)" :disabled="lesson.space === 0">Add to cart</button>
            </div>
            </div>
        </div>
        <div v-else>
            <h2>Your cart</h2>
            <div v-for="(item,index) in cart" :key="index">
                <p> {{item.topic }} - {{item.location}} - £{{item.price}}</p>
                <button v-on:click="removeFromCart(index)">Remove</button>
            </div>
            <h3>Checkout</h3>
                <input v-model="name" placeholder="Name">
                <span v-if="name && !isNameValid">Please enter a valid name</span>
                <input v-model="phone" placeholder="Phone">
                <span v-if="phone && !isPhoneValid">Must be 11 digits</span>
                <button v-on:click="checkout" :disabled="!canCheckOut">Checkout</button>
        </div>
    
        </div>

    <script type = "module">
        const {createApp} = Vue
        const API = 'https://m01005054-rafter-skl.onrender.com'
        const myApp = createApp({
            data(){
                return{
                   lessons: [],
                   cart:[],
                   showCart: false,
                   sortBy: 'topic',
                   sortOrder: 'ascending',
                   name: '',
                   phone: '',
                   orderMessage: '',
                   searchQuery: '',
                   searchIds: null,
                   teachers: [],
                   selectedTeacher: '',
                   teacherIds:  null,
                   api: API

                  
                     
                }
                
            },
            methods:{
                addToCart(lesson){
                    if (lesson.space > 0){
                        this.cart.push(lesson);
                        lesson.space--
                    }
                },
                toggleCart(){
                    this.showCart = !this.showCart;
                },
                removeFromCart(index){
                    const lesson = this.cart[index];
                    this.cart.splice(index,1);
                    lesson.space++;

                    if (this.cart.length === 0){
                        this.showCart = false;
                    }

                },
                checkout(){
                    const counts = {};
                    this.cart.forEach(lesson => {
                        counts[lesson._id] = (counts[lesson._id] || 0) + 1;
                        
                    });
                    const order = {
                        name: this.name,
                        phone: this.phone,
                        lessonIDs: Object.keys(counts),
                        lessons: Object.keys(counts).map(id => ({lessonId: id, spaces: counts[id]}))
                    };
                    fetch(API + '/orders',{
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(order)

                    })
                    .then(response => response.json())
                    .then(() => {
                        const uniqueLessons = [...new Set(this.cart)];
                        const updates = uniqueLessons.map(lesson => fetch(API +'/lessons/' + lesson._id, {
                            method: 'PUT',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({space: lesson.space})
                        }));
                        return Promise.all(updates);
                    })
                    .then(() =>{
                        this.orderMessage = `Thank you for your order, ${this.name}!!!`;
                        this.cart = [];
                        this.name = '';
                        this.phone = '';
                        this.showCart = false
                    });
                    
                }

            },
            computed: {
                sortedLessons(){
                    return [... this.lessons].sort((a,b)=>{
                        let result = 0;
                        if (a[this.sortBy]> b[this.sortBy]) result = 1;
                        if (a[this.sortBy]< b[this.sortBy]) result = -1;
                        return this.sortOrder === 'ascending' ? result : -result;

                    });
                },
                isNameValid(){
                    return /^[A-Za-z ]+$/.test(this.name);
                },
                isPhoneValid(){
                    return /^[0-9]{11}$/.test(this.phone);
                },
                canCheckOut(){
                    return this.isNameValid && this.isPhoneValid;
                },
                displayedLessons(){
                    return this.sortedLessons.filter(lesson => 
                    (this.searchIds === null || this.searchIds.includes(lesson._id)) &&
                    (this.teacherIds === null || this.teacherIds.includes(lesson._id))
                );

                }

            },
            watch:{
                searchQuery(newQuery){
                    if (newQuery.trim() === ''){
                        this.searchIds = null;
                        return;
                    }
                    fetch(API + '/search?q=' + encodeURIComponent(newQuery))
                    .then(response => response.json())
                    .then(results => {
                        this.searchIds = results.map(lesson => lesson._id);
                    });
                },
                selectedTeacher(newId){
                    if (newId === ''){
                        this.teacherIds = null;
                        return;
                    }
                    fetch(API + '/teachers/' + newId + '/lessons')
                    .then(response => response.json())
                    .then(results => {
                        this.teacherIds = results.map(lesson => lesson._id);
                    });
                }



            },
            created(){
                fetch(API + '/lessons')
                .then(response=> response.json())
                .then(data=> {
                    this.lessons = data;
                });
                fetch(API + '/teachers')
                .then(response => response.json())
                .then(data => {
                    this.teachers = data
                });
            }

          
        })
        myApp.mount('#Lesson')
    </script>

</body>
</html>
